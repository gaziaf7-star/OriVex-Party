plugins {
    id "com.android.application"
    id "com.google.gms.google-services" // Firebase services
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin" // Ensure Flutter is applied last
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode", "18")
def flutterVersionName = localProperties.getProperty("flutter.versionName", "1.0.16")

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.helloparty.live"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "11"
        freeCompilerArgs += ["-Xskip-metadata-version-check"]

    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }


    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.google.errorprone" && details.requested.name == "error_prone_annotations") {
                details.useVersion "2.15.0"
            }
        }
    }

    defaultConfig {
        applicationId "com.helloparty.live"
        minSdk 24
        targetSdk 36
        multiDexEnabled true
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Include native libraries for all required architectures
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        renderscriptTargetApi 36
        renderscriptSupportModeEnabled true
        externalNativeBuild {
            // For ndk-build, instead use the ndkBuild block.
            cmake {
                // Passes optional arguments to CMake.
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
            storePassword keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        debug {
            debuggable true
            // Signed with Zaviro's OWN key, not the shared machine debug
            // keystore. That keystore signs every debug build on this machine,
            // so its (package, SHA-1) pairs are spread across several Google
            // projects â€” and Google requires each pair to be globally unique
            // before it will create the Android OAuth client that Google
            // Sign-In needs. One key per app removes the whole class of clash,
            // and means debug and release present the same certificate.
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation 'com.otaliastudios:transcoder:0.10.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.huawei.hms:hwid:6.7.0.300'
}

flutter {
    source "../.."
}


//
// CHATGPT_DEBUG_SIGNING_FIX
// Debug builds must NOT use the release keystore.
//
android {
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}


